# ==============================================================================
# Prometheus Configuration for OpenBalancer Mesh
# ==============================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "openbalancer"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["openbalancer:8888"]
        labels:
          environment: "mesh"
          cluster: "openbalancer-mesh-cluster"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
