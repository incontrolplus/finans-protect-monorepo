name: OpenBalancer Multi-Arch Docker Publish (Docker Hub & GHCR)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
    paths:
      - 'core/**'
      - 'mesh/**'
      - 'Dockerfile*'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Specific Release Tag (e.g. v1.5.0)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build & Publish Multi-Arch Image (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: openbalancer
            dockerfile: ./Dockerfile
            context: .
            description: "OpenBalancer Core AI & API Load Balancer Engine"
            dh_repo: "incontrolplus/openbalancer"
            ghcr_repo: "ghcr.io/${{ github.repository_owner }}/openbalancer"
          - name: openbalancer-mesh
            dockerfile: ./Dockerfile.mesh
            context: .
            description: "OpenBalancer Mesh Proxy & Distributed Observability Stack"
            dh_repo: "incontrolplus/openbalancer-mesh"
            ghcr_repo: "ghcr.io/${{ github.repository_owner }}/openbalancer-mesh"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-Architecture Support)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Determine Docker Metadata & Tagging Strategy
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ matrix.image.ghcr_repo }}
            ${{ secrets.DOCKERHUB_USERNAME != '' && matrix.image.dh_repo || '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.inputs.tag_name }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.image.name }}
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.vendor=INCONTROL PLUS EOOD
            org.opencontainers.image.licenses=MIT

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Multi-Architecture Images (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Test Single-Arch Image Locally for Verification
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          load: true
          tags: ${{ matrix.image.name }}:local-test
          cache-from: type=gha,scope=${{ matrix.image.name }}

      - name: Verify Container Execution & Status Endpoint
        run: |
          echo "Starting ${{ matrix.image.name }} test container..."
          docker run -d --name test-${{ matrix.image.name }} -p 8088:8088 ${{ matrix.image.name }}:local-test
          sleep 2
          
          echo "Inspecting container logs:"
          docker logs test-${{ matrix.image.name }}
          
          echo "Testing status endpoint..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8088/openbalancer/status || true)
          echo "HTTP Response: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Expected HTTP 200 from container, got $STATUS"
            docker logs test-${{ matrix.image.name }}
            exit 1
          fi
          echo "✅ Container ${{ matrix.image.name }} is healthy and fully operational!"

      - name: Cleanup Verification Container
        if: always()
        run: |
          docker rm -f test-${{ matrix.image.name }} || true
