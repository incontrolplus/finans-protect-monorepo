name: OpenBalancer Release — GitHub Release, GHCR & PyPI Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.4.2)'
        required: true
        default: 'v1.4.2'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-publish:
    name: Build Multi-Arch Container, PyPI Package & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "Building OpenBalancer release for tag: ${TAG}"

      - name: Set up Python for PyPI Packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Python Package (sdist & wheel)
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Publish Python Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (if secrets configured)
        if: secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute Release Container Tags
        id: docker_tags
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          VER="${{ steps.vars.outputs.version }}"
          OWNER="${{ github.repository_owner }}"
          
          CORE_TAGS="ghcr.io/${OWNER}/openbalancer:${TAG}
          ghcr.io/${OWNER}/openbalancer:${VER}
          ghcr.io/${OWNER}/openbalancer:latest"
          
          MESH_TAGS="ghcr.io/${OWNER}/openbalancer-mesh:${TAG}
          ghcr.io/${OWNER}/openbalancer-mesh:${VER}
          ghcr.io/${OWNER}/openbalancer-mesh:latest"
          
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            CORE_TAGS="${CORE_TAGS}
            incontrolplus/openbalancer:${TAG}
            incontrolplus/openbalancer:${VER}
            incontrolplus/openbalancer:latest"
            
            MESH_TAGS="${MESH_TAGS}
            incontrolplus/openbalancer-mesh:${TAG}
            incontrolplus/openbalancer-mesh:${VER}
            incontrolplus/openbalancer-mesh:latest"
          fi
          
          echo "core_tags<<EOF" >> $GITHUB_OUTPUT
          echo "$CORE_TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "mesh_tags<<EOF" >> $GITHUB_OUTPUT
          echo "$MESH_TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build & Push OpenBalancer Core Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_tags.outputs.core_tags }}

      - name: Build & Push OpenBalancer Mesh Proxy Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.mesh
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_tags.outputs.mesh_tags }}

      - name: Create Standalone Release Archive & Bundle Assets
        run: |
          mkdir -p release-bundle
          tar -czvf "release-bundle/openbalancer-${{ steps.vars.outputs.tag }}.tar.gz" \
            -C core openbalancer.py config.json Dockerfile docker-compose.yml README.md LICENSE \
            -C .. install.sh
          cp dist/* release-bundle/
          ls -la release-bundle/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "OpenBalancer ${{ steps.vars.outputs.tag }} — Enterprise AI & API Load Balancer"
          draft: false
          prerelease: false
          files: release-bundle/*
          body: |
            ## ⚡ OpenBalancer ${{ steps.vars.outputs.tag }}

            Engineered & Maintained by **INCONTROL PLUS ЕООД** (https://www.openbalancer.com)  
            *High-Throughput Asynchronous Reverse Proxy & Intelligent Load Balancer for AI Clusters and Critical APIs.*

            ---

            ### 🚀 Quickstart

            #### 1. Install via PyPI:
            ```bash
            pip install openbalancer
            openbalancer demo
            ```

            #### 2. One-Line Installer (Linux / macOS):
            ```bash
            curl -fsSL https://www.openbalancer.com/install.sh | bash
            ```

            #### 3. Run with Docker (GHCR Multi-Arch):
            ```bash
            docker run -d --name openbalancer -p 8088:8088 ghcr.io/${{ github.repository }}:latest
            ```

            #### 4. Run Standalone Python:
            ```bash
            python3 core/openbalancer.py core/config.json
            ```

            ---

            ### 🌟 Key Highlights & Capabilities
            - **Asynchronous Non-Blocking Engine:** Sub-millisecond latency routing on Python `asyncio` sockets.
            - **Adaptive Routing Algorithms:** Weighted Round-Robin, Least-Connections, Consistent IP-Hash, Power-of-Two Random Choices.
            - **Prometheus & Dashboard Telemetry:** Native `/openbalancer/status` endpoint with real-time metrics and latency tracking.
            - **Zero-Buffer SSE Streaming:** Optimized for LLM inference tokens with O(1) memory overhead.
            - **99.9% Uptime B2B SLA Support:** Enterprise support and turnkey deployment by INCONTROL PLUS.

            ---

            ### 📦 Release Assets & Distribution
            - PyPI Package: `pip install openbalancer==${{ steps.vars.outputs.version }}`
            - Standalone Tarball Archive: `openbalancer-${{ steps.vars.outputs.tag }}.tar.gz`
            - Container Registry: `ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.tag }}`
