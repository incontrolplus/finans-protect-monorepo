name: OpenBalancer CI — Core Engine & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-core:
    name: Test Core Engine (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate JSON Configurations
        run: |
          python -m json.tool core/config.json > /dev/null
          echo "✅ core/config.json is valid JSON"

      - name: Compile Python Syntax
        run: |
          python -m py_compile core/openbalancer.py
          python -m py_compile core/test_balancer.py
          echo "✅ Python syntax compiles with 0 errors"

      - name: Execute Automated Verification Test Suite
        run: |
          python -m unittest discover -s tests
          python core/test_balancer.py

  test-packaging:
    name: Validate Python Packaging & Installation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build & Validation Tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build Package (sdist & wheel)
        run: |
          python -m build
          twine check dist/*

      - name: Test Wheel Installation & CLI Binary
        run: |
          python -m pip install dist/*.whl
          openbalancer version
          openbalancer validate -c core/config.json
          python -c "import openbalancer; print('Imported OpenBalancer:', openbalancer.__version__)"

  test-frontend:
    name: Validate Website & Cloudflare Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript Syntax
        run: |
          node --check website/js/i18n.js
          node --check website/js/main.js
          node --check website/_worker.js
          node --check website/functions/api/contact.js
          echo "✅ All JavaScript and Edge Worker files have valid syntax"

      - name: Validate Robots & Sitemap
        run: |
          test -f website/robots.txt
          test -f website/sitemap.xml
          echo "✅ robots.txt and sitemap.xml exist and are accessible"
