[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openbalancer"
version = "1.4.2"
description = "Intelligent Asynchronous Reverse Proxy & High-Performance Load Balancer for AI Clusters and APIs"
readme = "README.md"
authors = [{ name = "INCONTROL PLUS EOOD", email = "support@openbalancer.com" }]
license = { text = "MIT" }
keywords = ["loadbalancer", "reverse-proxy", "asyncio", "ai-gateway", "llm-streaming", "sse", "websockets", "devops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Internet :: Proxy Servers"
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://www.openbalancer.com"
Documentation = "https://www.openbalancer.com/docs"
Repository = "https://github.com/incontrolplus/openbalancer"
Issues = "https://github.com/incontrolplus/openbalancer/issues"

[project.scripts]
openbalancer = "core.openbalancer:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
